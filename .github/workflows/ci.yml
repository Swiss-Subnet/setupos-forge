name: ci

# Everything runs through `nix develop`, so CI gets the same go, sgdisk,
# mtools and e2fsprogs as a local shell. Without those the e2e tests skip
# themselves, and a skipped test reads as a passing one.
#
# Actions are pinned by commit. Tags move.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: gofmt
        run: |
          nix develop --command sh -c '
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "$unformatted"
              exit 1
            fi'

      - name: vet
        run: nix develop --command go vet ./...

      - name: test
        run: nix develop --command go test ./...

      - name: nix build
        run: nix build .#setupos-forge

      - name: the binary runs
        run: ./result/bin/setupos-forge version

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - run: nix develop --command just dist
